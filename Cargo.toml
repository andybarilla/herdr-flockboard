[package]
name = "flockboard"
version = "0.1.0"
edition = "2021"
description = "Live dashboard for Flock-managed agent work in a herdr session"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
